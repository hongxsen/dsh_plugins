    </radialGradient>
    <radialGradient id="lilac" cx="0.9" cy="0.18" r="0.42">
      <stop offset="0" stop-color="#c9b7ef" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#c9b7ef" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wave" x1="0" y1="1" x2="1" y2="0">
